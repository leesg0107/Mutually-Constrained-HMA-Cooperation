[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garagenet"
version = "0.0.1"
description = "GarageNet Phase-0 measurement harness: wall-clock completion time (deliberation + execution) per coordination mechanism across a coupling axis, for heterogeneous multi-robot teams."
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
plots = ["matplotlib"]
dev = ["pytest", "matplotlib"]

[tool.setuptools.packages.find]
include = ["garagenet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
